<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>店铺装修台 · LEXY莱克官方旗舰店</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- ============================ 顶栏（对标有赞：退出编辑器 / 正在装修 / 预览 · 存至草稿 · 生成代码） ============================ -->
<!-- ⚠️ 按钮叫「生成代码」而不是「立即发布」：它写回的是代码包里的 replica.js，
     已发布的小程序不会因此立刻更新，还需要在微信开发者工具上传并发布新版本。 -->
<!-- 结构与配色对齐有赞装修台顶栏：56px 高 / #202033 底 / 右侧按钮组 gap 16px、
     次级按钮 #444454、主按钮 #155BD4，圆角统一 2px。 -->
<header class="topbar mode-list" id="topbar">
  <div class="tb-left">
    <button class="tb-back tb-edit-only" id="btnBack" title="返回页面列表"><i class="tb-back-ic">‹</i>退出编辑器</button>
    <span class="tb-brand">LEXY 店铺装修台</span>
  </div>
  <div class="tb-center">
    <span class="tb-list-title">店铺页面</span>
    <span class="tb-label tb-edit-only">正在装修:</span>
    <span class="tb-logo tb-edit-only" id="edLogo"></span>
    <span class="tb-page tb-edit-only" id="edName">—</span>
    <span class="tb-tag tb-edit-only" id="edPath">—</span>
    <span class="tb-tag tb-edit-only" id="edPageTag">内置页</span>
  </div>
  <div class="tb-right">
    <!-- 管理员身份：未登录时所有 /api/decorate/*、/api/media/* 都会 401 -->
    <span class="tb-tag" id="tbWho">未登录</span>
    <button class="tb-btn" id="btnWho" title="使用管理员口令或长期令牌登录">登录</button>
    <span class="tb-dirty tb-edit-only" id="edDirty">无未保存改动</span>
    <button class="tb-btn tb-edit-only" id="btnKeys" title="键盘快捷键（Ctrl / ⌘ + K）">?</button>
    <button class="tb-btn tb-edit-only" id="btnDiff">查看变更</button>
    <button class="tb-btn tb-edit-only" id="btnVersions">版本</button>
    <button class="tb-btn tb-edit-only" id="btnDiscard">丢弃草稿</button>
    <button class="tb-btn tb-edit-only" id="btnSave">存至草稿</button>
    <button class="tb-btn primary tb-edit-only" id="btnPublish"
      title="把当前编辑内容写回 miniprogram/config/replica.js（生成小程序代码）。之后还需在微信开发者工具「上传」并在公众平台发布新版本，真机才会更新。">生成代码</button>
  </div>
</header>

<!-- ============================ 一、页面列表（对标有赞「店铺页面」列表） ============================ -->
<section id="viewList" class="view">
  <div class="list-top">
    <div class="lt-title">
      <b>店铺页面</b>
      <span class="muted">共 <b id="pageCount">0</b> 个页面 · 改完点「生成代码」写回源码，再上传发布小程序新版本才生效</span>
    </div>
    <div class="spacer"></div>
    <div class="stat" id="statTarget">目标文件：—</div>
    <div class="stat" id="statData">草稿 — · 版本 —</div>
    <div class="stat" id="statCustom">自定义页 — / —</div>
    <nav class="topnav">
      <a href="/debug" target="_blank">接口调试台</a>
      <!-- 「线上预览」这个名字不成立：/ 是本机后端渲染出来的本地效果，与已发布的小程序不是一回事 -->
      <a href="/preview" target="_blank">本地效果预览（非线上）</a>
    </nav>
    <button class="btn" id="btnReload" title="重新拉取页面列表">刷新</button>
  </div>

  <!-- 店铺导航：全局配置（对标有赞「导航设置」），单独一张卡，不混在页面列表里 -->
  <div class="navcard" id="navCard" hidden></div>

  <div class="toolbar">
    <div class="filters">
      <label>页面名称 <input id="fName" placeholder="搜索页面名称 / 备注"></label>
      <label>页面状态
        <select id="fStatus">
          <option value="">全部状态</option>
          <option value="published">已发布</option>
          <option value="draft">有草稿</option>
        </select>
      </label>
      <label>归属
        <select id="fBelongs"><option value="">全部</option></select>
      </label>
      <button class="btn" id="btnFilter">筛选</button>
      <button class="btn ghost" id="btnResetFilter">重置</button>
    </div>
    <button class="btn primary" id="btnCreatePage" title="新建一个自定义页面（发布后小程序端可访问）">+ 新建页面</button>
  </div>

  <div class="table-wrap">
    <table class="grid">
      <thead>
        <tr>
          <th>页面名称 · 路径 · 内容量</th>
          <th style="width:178px">页面状态</th>
          <th style="width:176px">数据来源</th>
          <th style="width:176px">备注</th>
          <th style="width:392px">操作</th>
        </tr>
      </thead>
      <tbody id="pageRows"></tbody>
    </table>
  </div>
  <div class="foot-hint" id="listFoot"></div>
</section>

<!-- ============================ 二、装修编辑器（对标有赞三栏：组件库 / 手机预览 / 属性面板） ============================ -->
<!-- 有赞的「页面布局」不是常驻栏，而是预览区右上角的一个按钮 + 右侧浮层面板；
     这里同构：从四栏收成三栏，页面布局收进 .col-layout-float。 -->
<section id="viewEdit" class="view edit" hidden>

  <!-- ---------- 左：组件库 ---------- -->
  <aside class="col col-lib">
    <div class="lib-tabs" id="libTabs"></div>
    <div class="lib-body">
      <div class="lib-desc" id="libDesc"></div>
      <div class="lib-grid" id="libGrid"></div>
      <button class="lib-add" id="btnAddCommon">+ 添加常用组件</button>
    </div>
  </aside>

  <!-- ---------- 中：手机预览（页面布局浮层挂在这里） ---------- -->
  <div class="col col-mid">
    <div class="mid-head">
      <span class="muted">点击预览中的组件可直接选中</span>
      <div class="spacer"></div>
      <label class="mini">机型
        <select id="deviceSel">
          <option value="375">iPhone 12（375）</option>
          <option value="320">iPhone SE（320）</option>
          <option value="414">iPhone Pro Max（414）</option>
        </select>
      </label>
      <label class="mini"><input type="checkbox" id="autoScroll" checked> 选中时定位</label>
    </div>

    <div class="preview-stage">
      <!-- 对标有赞：预览区右上角「页面布局」按钮（104×48 / 白底 / 阴影 / 圆角 2px） -->
      <button class="pv-layout-btn" id="btnPageLayout" title="显示 / 收起页面布局">页面布局</button>

      <div class="phone-stage">
        <div class="phone" id="phone">
          <div class="phone-bar">
            <span class="ph-time">9:41</span>
            <span class="ph-title" id="phTitle">首页</span>
            <span class="ph-dots">···</span>
          </div>
          <div class="phone-screen" id="preview"></div>
          <!-- 底部导航由 PvTabbar 按「店铺导航」的已发布配置渲染（不再写死 5 个文字） -->
          <div id="phTabbar"></div>
        </div>
        <div class="phone-model" id="phModel">iPhone 12 (375)</div>
      </div>

      <!-- 页面布局浮层（对标有赞 .preview-page-manager-wrapper：白底、左侧投影、贴预览区右缘） -->
      <aside class="col-layout-float" id="layoutPanel" hidden>
        <div class="col-head">
          <b>页面布局</b>
          <span class="muted" id="treeCount"></span>
          <button class="lp-close" id="btnLayoutClose" title="收起">✕</button>
        </div>
        <div class="col-scroll">
          <div class="fixed-hint">本页为固定结构页（内容按既定栏目排版），不支持拼装组件；需要自由排版请装修「首页」，或在页面列表「+ 新建页面」创建自定义页。</div>
          <div id="tree" class="tree"></div>
          <div id="treeAddWrap" class="tree-add"></div>
        </div>
        <div class="layout-foot" id="btnPageSetting">
          <i class="ic-gear"></i>页面设置
        </div>
      </aside>
    </div>
  </div>

  <!-- ---------- 右：属性面板 ---------- -->
  <aside class="col col-inspector">
    <div class="insp-head">
      <b>属性设置</b>
      <span class="muted" id="inspectorPath"></span>
    </div>
    <div class="col-scroll" id="inspector"></div>
  </aside>

</section>

<!-- ============================ 弹层 ============================ -->
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <b id="modalTitle">标题</b>
      <button class="btn ghost" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div id="toast"></div>
<div id="imgPreview" class="img-preview" hidden><img alt=""></div>

<!-- 预览渲染核心：装修台（编辑态）与前端预览页（/preview）共用同一份实现，必须先于 admin.js 加载 -->
<script src="/shared/pv-render.js"></script>
<!-- 底部导航渲染：装修台手机壳与 /preview 共用同一份（样式也由它自带注入） -->
<script src="/shared/pv-tabbar.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
