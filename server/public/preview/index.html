<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小程序预览 · LEXY莱克官方旗舰店</title>
<!--
  这个页面**不加载 admin/admin.css**。

  原因：预览的手机屏里要放的是「真机页面的真机样式」（由 mp-wxss 把 miniprogram 下的
  app.wxss / 页面 wxss / 组件 wxss 编译而成）。再叠一层装修台的样式表，
  两边的基础规则会互相打架（box-sizing、img 默认尺寸、button 默认外观…），
  预览就又不可信了。手机壳与页面外壳的样式都写在 preview.css 里，自成一套。

  真正要展示的样式编译结果注入到下面的 <style id="mpStyle"> 里。
-->
<link rel="stylesheet" href="/preview/preview.css">
<style id="mpStyle"></style>
</head>
<body class="pv-body">

<header class="pv-top">
  <div class="pv-brand">
    <span class="pv-mark">LEXY</span>
    <span class="pv-title">小程序预览
      <small>直接编译真机的 WXML + WXSS 渲染 —— 与微信开发者工具看到的是同一套页面源码</small>
    </span>
  </div>
  <div class="pv-spacer"></div>
  <label class="pv-field">机型
    <select id="pvDevice">
      <option value="375">iPhone（375）</option>
      <option value="320">iPhone SE（320）</option>
      <option value="414">iPhone Pro Max（414）</option>
    </select>
  </label>
  <label class="pv-field">轮播
    <select id="pvSwiper">
      <option value="0">第 1 张</option>
      <option value="1">第 2 张</option>
      <option value="2">第 3 张</option>
    </select>
  </label>
  <label class="pv-field pv-auto" title="装修台发布后自动更新预览">
    <input type="checkbox" id="pvAuto" checked> 自动刷新
    <span class="pv-dot" id="pvDot"></span>
  </label>
  <button class="btn" id="pvReload" title="重新编译页面源码">重新编译</button>
  <nav class="pv-links">
    <a href="/admin" target="_blank">装修台</a>
    <a href="/console" target="_blank">后台控制台</a>
    <a href="/debug" target="_blank">接口调试台</a>
  </nav>
</header>

<main class="pv-main">
  <!-- 左：页面列表（内置 5 页 + 装修台新建的自定义页） -->
  <aside class="pv-side">
    <div class="pv-side-head">
      <b>页面</b>
      <span class="muted" id="pvCount">—</span>
    </div>
    <div class="pv-list" id="pvPages"></div>
    <div class="pv-side-foot">
      渲染内核：真机 <code>WXML</code> + <code>WXSS</code><br>
      （1rpx = 0.5px，100vh = 手机屏可视区高）
    </div>
  </aside>

  <!-- 右：手机壳预览 -->
  <section class="pv-stage" id="pvStage">
    <!-- 状态条刻意放在手机壳**外面**：真机屏上没有这条东西，放进屏里就不像真机了 -->
    <div class="pv-status" id="pvStatus">—</div>
    <div class="phone" id="phone">
      <div class="phone-bar">
        <span class="ph-time">9:41</span>
        <span class="ph-title" id="phTitle">—</span>
        <span class="ph-capsule"><i></i><i></i><i></i></span>
      </div>
      <!-- 手机屏 = 小程序 page 的根节点（WXSS 里的 page{} 就编译到 .mp-root 上） -->
      <div class="phone-screen mp-root" id="preview"></div>
      <!-- 底部导航按 replica.TABBAR 渲染（装修台「店铺导航」发布写回），与真机 custom-tab-bar 同一份配置 -->
      <div id="phTabbar"></div>
    </div>
    <div class="pv-note" id="pvNote"></div>
  </section>
</main>

<div class="pv-toast" id="pvToast" hidden></div>

<script src="/shared/mp-wxss.js"></script>
<script src="/shared/mp-wxml.js"></script>
<script src="/shared/mp-runtime.js"></script>
<!-- 底部导航渲染：与装修台手机壳共用同一份（样式也由它自带注入） -->
<script src="/shared/pv-tabbar.js"></script>
<script src="/preview/preview.js"></script>
</body>
</html>
