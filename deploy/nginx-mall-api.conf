  # ---------------- 莱克企业商城小程序 · 后端 API（/mall-api/）----------------
  # 由 deploy/enable-nginx-mall.sh 自动插入到 sites-available/lexy-official-site
  # 的最后一个 catch-all `location /` 之前；幂等，重复执行不会插第二次。
  #
  # 反代目标：本机 3000（systemd 服务 lexy-mall）。
  # 小程序端 BASE_URL 填：
  #     https://14.103.50.137/mall-api     ← 443 的 catch-all 会把请求转回 80，白拿 HTTPS
  #     http://14.103.50.137/mall-api      ← 直连 80
  #
  # 为什么 proxy_pass 末尾要带 `/`：
  #   nginx 会把匹配到的 `/mall-api/` 前缀替换成 `/` 再转发，于是
  #     /mall-api/api/health      → /api/health
  #     /mall-api/uploads/x.png   → /uploads/x.png
  #   小程序端所有请求都是 BASE_URL + 后端原生路径，两边刚好对上。
  #
  # client_max_body_size 必须放开：nginx 默认 1m，而手机拍的商品图 3~5MB、
  #   短视频几十 MB，不放宽的话素材上传直接 413，且现象是「接口报错但后端日志里什么都没有」。
  #   这里给 60m —— 要 ≥ 后端 media.js 的视频上限（50MB）再加一点 multipart 开销。
  #   改这里时要连后端上限一起看，两处必须同向放宽。
  location ^~ /mall-api/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 60m;
    # 大文件上传 / 视频分段读取都不是「秒回」的，超时给足（默认 60s 在慢网络下会断）
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
  }
